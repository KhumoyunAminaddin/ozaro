<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>O'ZARO — аренда зеркал с гравировкой в Ташкенте</title>
  <meta name="description" content="Аренда зеркал с индивидуальной матовой гравировкой для свадеб, праздников и корпоративов в Ташкенте. Доставка и установка включены.">
  <meta property="og:title" content="O'ZARO — аренда зеркал с гравировкой">
  <meta property="og:description" content="Зеркала с вашей надписью для свадьбы, дня рождения или корпоратива. Ташкент, доставка и установка включены.">
  <meta property="og:image" content="img/forest.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
</head>
<body>
  <header class="top">
    <div class="wrap top-in">
      <a class="logo" href="#">O'ZARO</a>
      <nav>
        <a href="#mirrors" data-i18n="navMirrors"></a>
        <a href="#packages" data-i18n="navPackages"></a>
        <a href="#how" data-i18n="navHow"></a>
        <a href="#about" data-i18n="navAbout"></a>
      </nav>
      <div class="lang" role="group" aria-label="Язык / Til">
        <button data-lang="ru">RU</button><button data-lang="uz">UZ</button>
      </div>
      <a class="phone" data-bind="phoneLink"></a>
    </div>
  </header>

  <section class="hero">
    <div class="wrap hero-in">
      <div class="hero-text">
        <p class="kicker" data-i18n="kicker"></p>
        <h1>O'ZARO</h1>
        <p class="lead" data-i18n="heroLead"></p>
        <div class="cta-row">
          <a class="btn" href="#order" data-i18n="ctaOrder"></a>
          <a class="btn ghost" href="#packages" data-i18n="ctaPackages"></a>
        </div>
        <p class="note" data-i18n="heroNote"></p>
      </div>
      <figure class="hero-img">
        <span class="est">est.</span>
        <img src="img/forest.jpg" alt="" width="362" height="607">
        <span class="est" data-bind="established"></span>
      </figure>
    </div>
  </section>

  <section class="wrap sec" id="mirrors">
    <h2 data-i18n="mirrorsTitle"></h2>
    <p class="sub" data-i18n="mirrorsSub"></p>
    <div class="mirrors" id="mirrorList"></div>
  </section>

  <section class="sec band" id="packages">
    <div class="wrap">
      <h2 data-i18n="packagesTitle"></h2>
      <p class="sub" data-i18n="packagesSub"></p>
      <div class="packages" id="packageList"></div>
      <p class="buy" data-i18n="buyNote"></p>
    </div>
  </section>

  <section class="wrap sec" id="how">
    <h2 data-i18n="howTitle"></h2>
    <ol class="steps" id="steps"></ol>
    <div class="pay" data-i18n="payNote"></div>
  </section>

  <section class="sec band" id="about">
    <div class="wrap about">
      <div>
        <h2 data-i18n="aboutTitle"></h2>
        <p data-i18n="about1"></p>
        <p data-i18n="about2"></p>
        <p data-i18n="about3"></p>
      </div>
      <figure class="about-img">
        <img src="img/you-look-cute.jpg" alt="" loading="lazy" width="559" height="622">
        <figcaption><b>O'ZARO:</b> <span data-i18n="motto"></span></figcaption>
      </figure>
    </div>
    <div class="wrap">
      <h3 class="team-title" data-i18n="teamTitle"></h3>
      <div class="team" id="team"></div>
    </div>
  </section>

  <section class="order-sec" id="order">
    <div class="wrap order-in">
      <div>
        <h2 data-i18n="orderTitle"></h2>
        <p data-i18n="orderLead"></p>
        <ul class="order-facts" id="orderFacts"></ul>
        <img class="order-img" src="img/event-mirror.jpg" alt="" loading="lazy" width="474" height="1050">
      </div>
      <form id="form" novalidate>
        <label><span data-i18n="fName"></span><input name="name" autocomplete="name" required maxlength="60"></label>
        <label><span data-i18n="fPhone"></span><input name="phone" type="tel" autocomplete="tel" inputmode="tel" placeholder="+998 __ ___ __ __" required maxlength="20"></label>
        <label><span data-i18n="fDate"></span><input name="eventDate" type="date" required></label>
        <label><span data-i18n="fPackage"></span><select name="package" id="packageSel"></select></label>
        <label class="full"><span data-i18n="fMirrors"></span>
          <span class="chips" id="mirrorChips"></span>
        </label>
        <label class="full"><span data-i18n="fEngraving"></span><input name="engraving" maxlength="80" data-i18n-ph="fEngravingPh"></label>
        <label><span data-i18n="fEvent"></span><select name="eventType" id="eventSel"></select></label>
        <label><span data-i18n="fDistrict"></span><select name="district" id="districtSel"></select></label>
        <label class="full"><span data-i18n="fComment"></span><textarea name="comment" rows="3" maxlength="500" data-i18n-ph="fCommentPh"></textarea></label>
        <input name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
        <div class="total full" id="total"></div>
        <button class="btn full" type="submit" data-i18n="fSubmit"></button>
        <p class="status full" id="status" role="status"></p>
      </form>
    </div>
  </section>

  <section class="wrap sec" id="faq">
    <h2 data-i18n="faqTitle"></h2>
    <div id="faqList"></div>
  </section>

  <footer class="foot">
    <div class="wrap foot-in">
      <div class="foot-brand"><b>O'ZARO</b><span data-i18n="footerTag"></span></div>
      <div class="foot-links">
        <span data-bind="city"></span>
        <a data-bind="phoneLink"></a>
        <a data-bind="igLink" target="_blank" rel="noopener">Instagram @ozaro.uz</a>
      </div>
    </div>
  </footer>

  <a class="float-ig" data-bind="igLink" target="_blank" rel="noopener" aria-label="Instagram">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>
  </a>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
